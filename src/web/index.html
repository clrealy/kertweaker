<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kertweaker</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="/" aria-label="kertweaker home">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
      <rect x="3" y="3" width="18" height="18" rx="4" fill="none" stroke="currentColor" stroke-width="2"/>
      <path d="M8 8v8M8 12l4-4M8 12l4 4M15 8v8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span>kertweaker</span>
  </a>
  <div class="machine-chip" id="machine-chip"></div>
  <input id="search" class="search" type="search" placeholder="Search tweaks or CONFIG_ symbols" aria-label="Search tweaks">
</header>
<div class="layout">
  <nav class="sidebar" id="nav" aria-label="Sections"></nav>
  <main id="main" tabindex="-1"><p class="loading">Reading your machine...</p></main>
  <aside class="summary" id="summary" aria-label="Your changes"></aside>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="/app.js"></script>
</body>
</html>
