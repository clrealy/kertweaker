<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kertweaker - sign in</title>
<link rel="stylesheet" href="/style.css">
</head>
<body class="login">
<main class="login-card">
  <h1>kertweaker</h1>
  <p>This page needs the access token from the terminal where kertweaker is running.
     Open the full URL it printed, or paste the token here.</p>
  <form method="get" action="/">
    <label for="token">Access token</label>
    <input id="token" name="token" type="password" autocomplete="off" autofocus required>
    <button class="btn primary" type="submit">Open</button>
  </form>
</main>
</body>
</html>
